name: Deploy Website & Cloud Run

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-cloud-deploy'
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Verification
        run: npm run lint

      - name: Firestore Security Rules ESLint Verification
        run: npx eslint firestore.rules

      - name: Build Production Bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-github-pages:
    name: Deploy Website to GitHub Pages
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloud-run-and-firestore:
    name: Deploy Full-Stack Server to Cloud Run & Firestore Rules
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: ${{ secrets.GCP_SA_KEY != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Firestore Security Rules
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --project seraphic-snow-p5w43

      - name: Deploy Full-Stack Container to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: lifegraph-finops-admin
          region: asia-southeast1
          source: .
          flags: '--allow-unauthenticated --port=3000'
          env_vars: |
            NODE_ENV=production
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
