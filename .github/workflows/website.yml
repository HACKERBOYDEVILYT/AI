name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Package Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          rm -f bun.lock package-lock.json yarn.lock pnpm-lock.yaml
          npm install --legacy-peer-deps

      - name: Build Production Website
        run: |
          npx vite build
          cp dist/index.html dist/404.html || true
          touch dist/.nojekyll

      - name: Upload Website Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: lifegraph-website-dist
          path: dist

      - name: Deploy to gh-pages Branch (Branch-based Pages Fallback)
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Upload Pages Artifact (for GitHub Actions Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
