name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          rm -f bun.lock package-lock.json yarn.lock pnpm-lock.yaml
          npm install --legacy-peer-deps

      - name: Build Production Website
        run: |
          npx vite build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Website Build Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: lifegraph-website-dist
          path: dist

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Setup Pages Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dist

      - name: Deploy to GitHub Pages (If Actions mode enabled)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
