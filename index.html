<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ensure trailing slash for GitHub Pages repo subpaths so relative assets load properly
      (function() {
        var p = window.location.pathname;
        if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <title>LIFEGRAPH FinOps & Bangladesh Payout Admin</title>
    <meta name="description" content="Owner-only financial ledger, AI job revenue verification, and bKash/Bank withdrawal administration console for LIFEGRAPH." />
    <meta property="og:title" content="LIFEGRAPH FinOps & Bangladesh Payout Admin" />
    <meta property="og:description" content="Owner-only financial ledger, AI job revenue verification, and bKash/Bank withdrawal administration console for LIFEGRAPH." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LIFEGRAPH" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Global error listener to intercept asset loading errors or unhandled exceptions
      window.addEventListener('error', function(event) {
        var target = event.target;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var statusEl = document.getElementById('init-loading-text');
          if (statusEl) {
            statusEl.innerHTML = '<span style="color:#ef4444;font-weight:600;">Resource loading interrupted</span><br><span style="font-size:11px;color:#94a3b8;">Click below to reload the console:</span><br><br><button onclick="window.location.reload(true)" style="background:#38bdf8;color:#0f172a;border:none;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">Reload Console</button>';
          }
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
        <div style="text-align: center; padding: 24px; max-width: 420px; width: 100%;">
          <div id="init-spinner" style="width: 36px; height: 36px; border: 3px solid #334155; border-top-color: #38bdf8; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite;"></div>
          <h2 style="font-size: 18px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.02em;">LIFEGRAPH FinOps</h2>
          <div id="init-loading-text" style="font-size: 12px; color: #94a3b8; margin: 0; line-height: 1.5;">
            Loading secure financial console...
          </div>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        // Watchdog: If React doesn't mount within 4 seconds, show interactive safe-mode button
        setTimeout(function() {
          var loadText = document.getElementById('init-loading-text');
          if (loadText && document.getElementById('init-spinner')) {
            loadText.innerHTML = '<span style="color:#f59e0b;font-weight:600;">Initialization taking longer than usual</span><br><span style="font-size:11px;color:#94a3b8;display:block;margin-top:4px;">Tap below to reload or reset cached state:</span><div style="display:flex;gap:8px;justify-content:center;margin-top:14px;"><button onclick="window.location.reload(true)" style="background:#334155;color:#f8fafc;border:none;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;">Reload</button><button onclick="try{localStorage.clear();}catch(e){}window.location.reload(true)" style="background:#38bdf8;color:#0f172a;border:none;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">Reset &amp; Enter</button></div>';
          }
        }, 4000);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(function(err) {
            console.warn('SW registration bypassed:', err);
          });
        });
      }
    </script>
  </body>
</html>
