    <script>
      // Manage Service Workers: In iframe preview unregister to avoid stale cache; in top-level window register for WebAPK
      var isIframe = window.self !== window.top;
      if ('serviceWorker' in navigator) {
        if (isIframe) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(err) {
              console.warn('DevPilot PWA note:', err);
            });
          });
        }
      }
    </script>

  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background-color:#090d16;color:#ffffff;font-family:'Hind Siliguri','Plus Jakarta Sans',system-ui,sans-serif;padding:20px;">
        <div style="max-width:440px;width:100%;text-align:center;background:#111827;padding:36px;border-radius:16px;border:1px solid #1f2937;box-shadow:0 20px 40px rgba(0,0,0,0.5);">
          <div style="width:54px;height:54px;margin:0 auto 16px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:26px;color:#ffffff;box-shadow:0 8px 16px rgba(37,99,235,0.35);">DP</div>
          <h1 style="font-size:20px;font-weight:700;margin:0 0 8px;letter-spacing:-0.02em;color:#f8fafc;">DevPilot Platform</h1>
          <p style="font-size:13px;color:#94a3b8;margin:0 0 24px;line-height:1.6;">ডিজিটাল সার্ভিস ও ইঞ্জিনিয়ারিং কনসোল লোড হচ্ছে...</p>
          <div style="width:36px;height:36px;margin:0 auto 20px;border:3px solid #1f2937;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;"></div>
          <button onclick="window.location.reload()" style="padding:10px 18px;background:#1f2937;color:#e2e8f0;font-size:12px;font-weight:600;border:1px solid #374151;border-radius:8px;cursor:pointer;">রিলোড করুন</button>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
